databaseChangeLog:
  # Remove the legacy flower-store tags (Mamá, Novia, ...) — they do not apply to a
  # videogame store. Clear join rows first to respect the FK, then the tags.
  - changeSet:
      id: 012-clear-legacy-tags
      author: kiro
      changes:
        - delete:
            tableName: product_tag
        - delete:
            tableName: tags

  # Insert the videogame-store tag taxonomy. The `type` column groups tags into
  # categories (Console, ESRB, Brand, Genre, Condition, Region).
  - changeSet:
      id: 012-insert-videogame-tags
      author: kiro
      changes:
