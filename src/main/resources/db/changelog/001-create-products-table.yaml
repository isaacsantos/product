databaseChangeLog:
  - changeSet:
      id: 001-create-products-table
      author: kiro
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: CLOB
                  constraints:
                    nullable: true
              - column:
                  name: price
                  type: NUMERIC(19, 2)
                  constraints:
                    nullable: false
